[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
markers =
    integration: requires live services (DB, Ollama, SharePoint) — excluded by default
    slow: slow-running tests
addopts = -v --tb=short -m "not integration"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
